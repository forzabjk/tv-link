name: Bizim Ev TV M3U Guncelle

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: yt-dlp Kur
        run: pip install -U yt-dlp

      - name: Yayin Linkini Al
        env:
          COOKIES: ${{ secrets.COOKIES }}
        run: |
          echo "# Netscape HTTP Cookie File" > cookies.txt
          printf "%s\n" "$COOKIES" >> cookies.txt
          STREAM_URL=$(yt-dlp --cookies cookies.txt --extractor-args "youtube:player_client=tv,mweb" -f b -g "https://youtube.com/watch?v=30M_F_2xy9Q")
          echo "#EXTM3U" > bizimev.m3u8
          echo "#EXT-X-STREAM-INF:BANDWIDTH=1280000" >> bizimev.m3u8
          echo "$STREAM_URL" >> bizimev.m3u8
          rm -f cookies.txt

      - name: GitHuba Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add bizimev.m3u8
          git diff --quiet && git diff --staged --quiet || (git commit -m "Guncellendi" && git push)
