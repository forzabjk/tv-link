name: Bizim Ev TV M3U Guncelle

on:
  schedule:
    - cron: '0 */3 * * *' # Her 3 saatte bir linki tazeler
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: yt-dlp Kur
        run: |
          pip install -U yt-dlp

      - name: Yayin Linkini Al ve M3U Olustur
        run: |
          STREAM_URL=$(yt-dlp --extractor-args "youtube:player_client=android,ios" -f best -g "https://youtube.com")
          echo "#EXTM3U" > bizimev.m3u
          echo "#EXTINF:-1 tvg-logo=\"\" group-title=\"Ulusal\",Bizim Ev TV" >> bizimev.m3u
          echo "$STREAM_URL" >> bizimev.m3u

      - name: GitHuba Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add bizimev.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Yayin linki guncellendi" && git push)
