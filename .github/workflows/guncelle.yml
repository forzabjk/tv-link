name: TV Kanallari M3U Guncelle

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Deno ve yt-dlp Kur
        uses: denoland/setup-deno@v2
      - run: pip install -U yt-dlp

      - name: Yayin Linklerini Al
        env:
          COOKIES: ${{ secrets.COOKIES }}
        run: |
          echo "# Netscape HTTP Cookie File" > cookies.txt
          printf "%s\n" "$COOKIES" >> cookies.txt
          HOST="https://youtube.com"


          # 1. Bizim Ev TV
          URL_BIZIMEV="$HOST/@bizimevtv2000/live"
          STREAM_BIZIMEV=$(yt-dlp --cookies cookies.txt --remote-components ejs:github -f b -g "$URL_BIZIMEV") || true
          if [ -n "$STREAM_BIZIMEV" ]; then
            echo "#EXTM3U" > bizimev.m3u8
            echo "#EXT-X-STREAM-INF:BANDWIDTH=1280000" >> bizimev.m3u8
            echo "$STREAM_BIZIMEV" >> bizimev.m3u8
          fi


          # 2. Beyaz TV
          URL_BEYAZTV="$HOST/@BeyazTV/live/canli-yayin/"
          STREAM_BEYAZTV=$(yt-dlp --cookies cookies.txt --remote-components ejs:github -f b -g "$URL_BEYAZTV") || true
          echo "#EXTM3U" > beyaztv.m3u8
          echo "#EXT-X-STREAM-INF:BANDWIDTH=5000000" >> beyaztv.m3u8
          echo "$STREAM_BEYAZTV" >> beyaztv.m3u8

          rm -f cookies.txt

      - name: GitHuba Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add bizimev.m3u8 beyaztv.m3u8
          git diff --quiet && git diff --staged --quiet || (git commit -m "Guncellendi" && git push)
